name: Create Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'Mani_3840494915_Mani'
        required: true
        type: string
      key_alias:
        description: 'Mani_3840494915_Mani'
        required: true
        default: 'foxeggs'
        type: string
      validity_years:
        description: '1000 yars'
        required: true
        default: '100'
        type: string

jobs:
  create:
    runs-on: ubuntu-24.04

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Keystore
        env:
          KS_PASS: ${{ inputs.keystore_password }}
          KS_ALIAS: ${{ inputs.key_alias }}
          KS_VALIDITY: ${{ inputs.validity_years }}
        run: |
          set -e

          # محاسبه روز
          VALIDITY_DAYS=$((KS_VALIDITY * 365))

          # ساخت keystore
          keytool -genkeypair \
            -v \
            -keystore FoxEggs.keystore \
            -alias "$KS_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$VALIDITY_DAYS" \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=FoxEggs, OU=Development, O=FoxEggs, L=Tehran, ST=Tehran, C=IR"

          echo "✅ Keystore created."

          # چک
          keytool -list -keystore FoxEggs.keystore -storepass "$KS_PASS"

      - name: Encode to Base64
        env:
          KS_PASS: ${{ inputs.keystore_password }}
        run: |
          base64 -w 0 FoxEggs.keystore > keystore_base64.txt
          echo "✅ Base64 created."
          echo "length: $(wc -c < keystore_base64.txt) chars"

      - name: Create info file
        env:
          KS_PASS: ${{ inputs.keystore_password }}
          KS_ALIAS: ${{ inputs.key_alias }}
        run: |
          cat > KEYSTORE_INFO.txt <<EOF
          ========================================
          FOXEGGS WALLET - KEYSTORE INFO
          ========================================

          ⚠️  این فایل رو در جای امن نگه دار!
          اگه گم بشه، نمیتونی اپ رو آپدیت کنی!

          ----------------------------------------
          KEYSTORE PASSWORD:
          ----------------------------------------
          $KS_PASS

          ----------------------------------------
          KEY ALIAS:
          ----------------------------------------
          $KS_ALIAS

          ----------------------------------------
          KEY PASSWORD:
          ----------------------------------------
          (همون keystore password)

          ----------------------------------------
          FILE NAME:
          ----------------------------------------
          FoxEggs.keystore

          ----------------------------------------
          VALIDITY:
          ----------------------------------------
          ${{ inputs.validity_years }} سال

          ----------------------------------------
          GitHub Secret - KEYSTORE_BASE64:
          ----------------------------------------
          محتوای فایل keystore_base64.txt رو کپی کن
          و توی GitHub Secret به اسم KEYSTORE_BASE64 بذار.

          ----------------------------------------
          GitHub Secret - KEYSTORE_PASSWORD:
          ----------------------------------------
          همون پسورد بالا رو توی Secret
          به اسم KEYSTORE_PASSWORD بذار.

          ========================================
          ساخت شده در: $(date -u)
          ========================================
          EOF
          echo "✅ Info file created."

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: FoxEggs-Keystore
          path: |
            FoxEggs.keystore
            keystore_base64.txt
            KEYSTORE_INFO.txt
          retention-days: 7

      - name: Summary
        run: |
          echo "## ✅ Keystore ساخته شد!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 دانلود" >> $GITHUB_STEP_SUMMARY
          echo "برو به پایین همین صفحه → بخش **Artifacts** → دانلود کن:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`FoxEggs.keystore\` — فایل اصلی (backup کن!)" >> $GITHUB_STEP_SUMMARY
          echo "- \`keystore_base64.txt\` — محتواش رو توی Secret بذار" >> $GITHUB_STEP_SUMMARY
          echo "- \`KEYSTORE_INFO.txt\` — پسورد و alias" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔐 Secrets موردنیاز" >> $GITHUB_STEP_SUMMARY
          echo "| Name | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEYSTORE_BASE64\` | محتوای \`keystore_base64.txt\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`KEYSTORE_PASSWORD\` | همون پسوردی که الان وارد کردی |" >> $GITHUB_STEP_SUMMARY
